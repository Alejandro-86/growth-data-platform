[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "growth-data-platform"
version = "0.1.0"
description = "Customer data platform: dbt + Airflow pipeline with a reverse-ETL sync to a MarTech-style audience API"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dbt = [
    "dbt-duckdb>=1.9",
]
airflow = [
    "apache-airflow>=2.10,<3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "black>=24.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/growth_platform"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

# Airflow's TaskFlow decorators return XComArg proxies at DAG-definition time,
# which mypy has no stubs for — a known upstream limitation, not a real bug.
[[tool.mypy.overrides]]
module = "growth_platform.dags.*"
disable_error_code = ["arg-type"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"
